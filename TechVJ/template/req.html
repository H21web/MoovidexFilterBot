<script src="https://cdn.jsdelivr.net/npm/@oplayer/core@latest/dist/index.min.js"></script>

<script>
    const defaultImageUrl = "https://h21web.github.io/host/assets/images/folder.png";
    const tmdbKey = "{{ tmdb_api_key }}";
    const botUrl = "{{ bot_url }}";

    // Safe URL details extraction with error handling
    let downloadlink = "";
    let FileName = "{{ file_name }}"; // Use template variable as primary source
    
    try {
        const videoLink = window.location.href;
        const url = new URL(videoLink);
        const domainUrl = url.origin;
        const pathnameParts = url.pathname.split('/');
        
        // Safer array access
        const videoId = pathnameParts.length > 2 ? pathnameParts[2] : 'unknown';
        const urlFileName = pathnameParts.length > 3 ? pathnameParts[3] : FileName;
        
        // Use URL filename if template variable is not rendered
        if (!FileName || FileName.includes("{{")) {
            FileName = decodeURIComponent(urlFileName);
        }

        const hashParam = url.searchParams.get("hash") || "";
        const encodedName = encodeURIComponent(FileName);
        downloadlink = `${domainUrl}/${videoId}/${encodedName}?hash=${hashParam}`
    } catch (e) {
        console.error("URL Parsing Error:", e);
        downloadlink = window.location.href; // Fallback to current URL
    }

    // Enhanced Clean Filename for Better TMDB Search
    function cleanTitle(filename) {
        if (!filename) return "";
        let name = filename;
        
        // Remove file extension
        name = name.replace(/\.[^/.]+$/, "");
        
        // Replace separators with spaces
        name = name.replace(/[._-]/g, " ");
        
        // Remove common quality/scene tags and brackets
        const junkPatterns = /\b(1080p|720p|480p|2160p|4k|5k|8k|HD|SD|FHD|UHD|WEB-DL|WEBRip|BluRay|BRRip|DVDRip|DVD-Rip|H264|H265|x264|x265|AAC|AC3|E-AC3|DTS|TrueHD|10bit|HEVC|HDR|REMUX|S\d+E\d+|S\d+|E\d+|EXTENDED|REMASTERED|UNRATED|DIRECTORS.CUT)\b/gi;
        name = name.replace(junkPatterns, "");
        
        // Remove content in brackets and parentheses
        name = name.replace(/\[.*?\]|\(.*?\)/g, "");
        
        // Clean up multiple spaces
        return name.replace(/\s+/g, ' ').trim();
    }

    // Robust Poster Fetch using TMDB with Enhanced Error Handling
    function fetchPoster(rawFilename, callback) {
        if (!tmdbKey || tmdbKey === "None" || tmdbKey.includes("{{")) {
            console.log("No TMDB Key available, using default poster.");
            callback(defaultImageUrl);
            return;
        }

        const cleanName = cleanTitle(decodeURIComponent(rawFilename));
        console.log("Searching TMDB for:", cleanName);

        if (!cleanName) {
            console.log("Empty search query, using default poster.");
            callback(defaultImageUrl);
            return;
        }

        const searchUrl = `https://api.themoviedb.org/3/search/multi?api_key=${tmdbKey}&query=${encodeURIComponent(cleanName)}`;

        $.ajax({
            url: searchUrl,
            method: "GET",
            timeout: 5000, // 5 second timeout to prevent hanging
            success: function(data) {
                if (data.results && data.results.length > 0) {
                    const result = data.results[0];
                    // Prefer backdrop for video player poster (better aspect ratio)
                    const posterPath = result.backdrop_path || result.poster_path;
                    if (posterPath) {
                        const posterUrl = `https://image.tmdb.org/t/p/w780${posterPath}`;
                        console.log("TMDB Poster found:", posterUrl);
                        callback(posterUrl);
                    } else {
                        console.log("No poster path in TMDB result.");
                        callback(defaultImageUrl);
                    }
                } else {
                    console.log("No TMDB results found for query.");
                    callback(defaultImageUrl);
                }
            },
            error: function(xhr, status, error) {
                console.error("TMDB API Error:", status, error);
                callback(defaultImageUrl);
            }
        });
    }

    // Initialize OPlayer with video and poster - Enhanced with Error Handling
    function initializePlayer(posterUrl) {
        if (typeof OPlayer === 'undefined') {
            console.error("OPlayer library not loaded!");
            return;
        }
        
        console.log("Initializing player with poster:", posterUrl);
        console.log("Video source:", downloadlink);
        
        try {
            OPlayer.make('#oplayer', {
                source: {
                    src: downloadlink,
                    poster: posterUrl
                }
            })
            .use([
                OUI({
                    fullscreen: true,
                    coverButton: true,
                    miniProgressBar: true,
                    autoFocus: false, // Prevent unwanted scrolling
                    forceLandscapeOnFullscreen: true,
                    screenshot: false,
                    pictureInPicture: true,
                    showControls: 'always',
                    keyboard: { focused: true, global: false },
                    settings: ['loop'],
                    theme: {
                        primaryColor: '#6A00BE',
                        watermark: {
                            src: 'https://h21web.github.io/cdn/assets/moovidex-logo.png',
                            style: {
                                position: 'absolute',
                                top: '0px',
                                right: '8px',
                                width: '40px',
                                height: 'auto'
                            },
                            attrs: {
                                class: 'watermark'
                            }
                        }
                    },
                    speeds: ['2.0', '1.75', '1.25', '1.0', '0.75', '0.5'],
                    slideToSeek: 'long-touch',
                    controlBar: false,
                    topSetting: false,
                }),
                OHls({
                    forceHLS: true,
                    library: 'https://cdn.jsdelivr.net/npm/hls.js@0.14.17/dist/hls.min.js'
                })
            ])
            .create();
            console.log("Player initialized successfully!");
        } catch (e) {
            console.error("Player Initialization Error:", e);
        }
    }

    // Trigger Flow
    fetchPoster(`${FileName}`, function(posterUrl) {
        initializePlayer(posterUrl);
    });

    // --- Player Intents (Fixed URLs) ---
    
    function mx_player() {
        const intent = `intent:${downloadlink}#Intent;package=com.mxtech.videoplayer.ad;type=video/*;end`;
        window.location.href = intent;
    }

    function vlc_player() {
        // VLC Android Intent - Fixed (removed problematic scheme parameter)
        const intent = `intent:${downloadlink}#Intent;package=org.videolan.vlc;type=video/*;end`;
        window.location.href = intent;
    }

    function playit_player() {
       const intent = `intent:${downloadlink}#Intent;package=com.playit.videoplayer;type=video/*;end`;
       window.location.href = intent;
    }

    function s_player() {
        // Simple Player
        window.open(downloadlink, '_blank'); 
    }

    function km_player() {
        const intent = `intent:${downloadlink}#Intent;package=com.kmplayer;type=video/*;end`;
        window.location.href = intent;
    }
    
    function u_player() {
         const intent = `intent:${downloadlink}#Intent;package=uplayer.video.player;type=video/*;end`;
         window.location.href = intent;
    }

    // Helper Functions
    function download() {
        window.open(downloadlink, '_blank');
        try { Telegram.WebApp.HapticFeedback.notificationOccurred('success'); } catch(e){}
    }
      
    function openTG() {
        if(botUrl && botUrl !== "None" && !botUrl.includes("{{")) {
             const url = botUrl.startsWith("http") ? botUrl : "https://" + botUrl;
             window.open(url, '_blank');
        } else {
             window.open("https://telegram.me/moovidexrobot", '_blank');
        }
        try { Telegram.WebApp.close(); } catch(e){}
    }
      
    function copyUrl() {
        navigator.clipboard.writeText(downloadlink)
            .then(() => alert('URL copied to clipboard!'))
            .catch((error) => console.error('Failed to copy URL: ', error));
    }
    
    // Auto-fill details from Filename (Client-side regex)
    // No changes needed to the existing logic below, just ensuring it runs
    
    let tg = window.Telegram.WebApp; 
    try {
        tg.expand();
        tg.MainButton.setText("Powered by Moovidex"); 
        tg.MainButton.show();
    } catch(e) {}
    
    let profName = document.getElementById("usernametg"); 
    if(profName && tg.initDataUnsafe && tg.initDataUnsafe.user) {
        profName.innerText = `${tg.initDataUnsafe.user.first_name}`;
    }

</script>
      
      


<script>
    


    // Select the element with the specified id
        const textElement = document.getElementById('checktxt');

        // Get the text content from the selected element
        const text = textElement.textContent.trim().toLowerCase();

        // Specify the words you want to check for
        const resolutionKeywords = ['2160p', '1440p', '1080p', '720p', '480p', '360p', '240p','DVD-Rip','Web-DL'];
        const languageKeywords = ['Malayalam', 'Tamil', 'Hindi', 'Telugu', 'Kannada', 'English', 'Multi Audio' ,'Dual Audio', 'Spanish', 'Bengali', 'Bengla', 'Gujarati', 'Marathi', 'German', 'Chinese', 'Japanese', 'Korean', 'Urdu'];
        const formatKeywords = ['mkv', 'mp4', 'avi', 'mp3'];

        // Variables to store extracted information
        const year = text.match(/\b\d{4}\b/) ? text.match(/\b\d{4}\b/)[0] : 'N/A';
        const format = formatKeywords.find(word => text.includes(word.toLowerCase())) || 'N/A';
        const resolution = resolutionKeywords.find(word => text.includes(word.toLowerCase())) || 'N/A';
        const language = languageKeywords.find(word => text.includes(word.toLowerCase())) || 'N/A';

        // Function to update the HTML content
        const updateHtmlContent = (id, value) => {
            document.getElementById(id).textContent = value;
        };

        // Update the HTML content with the extracted information
        updateHtmlContent('year-placeholder', year);
        updateHtmlContent('format-placeholder', format);
        updateHtmlContent('resolution-placeholder', resolution);
        updateHtmlContent('language-placeholder', language);
        

    </script>

      
      


<script>
    function shareContent() {
        const shareData = {
            title: 'Check this out!',
            text: 'Here is some interesting content I want to share with you.',
            url: window.location.href
        };

        // Check if the Web Share API is available
        if (navigator.share) {
            navigator.share(shareData)
                .then(() => console.log('Content shared successfully!'))
                .catch(err => {
                    console.error('Error sharing content:', err);
                    fallbackShare();  // Attempt fallback if sharing fails
                });
        } else {
            // If the Web Share API is not supported, use fallback
            fallbackShare();
        }
    }

    function fallbackShare() {
        const fallbackUrl = window.location.href;

        // Copy URL to clipboard
        navigator.clipboard.writeText(fallbackUrl)
            .then(() => {
                alert('This browser does not support share function. Link copied to clipboard! You can paste it anywhere.');
            })
            .catch(err => {
                console.error('Error copying to clipboard:', err);
                alert('Could not copy the link. Please share this URL manually: ' + fallbackUrl);
            });
    }

    // Add event listener to the share button
    document.getElementById('shareBtn').addEventListener('click', function(event) {
        event.preventDefault();  // Prevent the default anchor behavior
        shareContent();  // Call the share function
    });
</script>
