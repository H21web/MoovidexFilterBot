{% extends "base.html" %}
{% block content %}
<h1>Users</h1>
<div class="card">
    <h3>All Users</h3>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Joined Date</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody>
            {% for user in users %}
            <tr>
                <td>{{ user.id }}</td>
                <td>{{ user.name }}</td>
                <td>{{ user.joined_date or 'N/A' }}</td>
                <td>
                    {% if user.ban_status.is_banned %}
                    <span style="color: red;">Banned</span>
                    {% else %}
                    <span style="color: green;">Active</span>
                    {% endif %}
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
