<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moovidex Admin Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: #1a1a1a; color: #f0f0f0; display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar */
        .sidebar { width: 250px; background-color: #2c2c2c; padding: 20px; display: flex; flex-direction: column; transition: transform 0.3s ease; z-index: 1000; height: 100%; box-sizing: border-box; overflow-y: auto; }
        .sidebar h2 { margin-top: 0; color: #4CAF50; display: flex; justify-content: space-between; align-items: center; }
        .sidebar a { color: #ccc; text-decoration: none; padding: 10px; margin: 5px 0; border-radius: 5px; transition: background 0.3s; display: block; }
        .sidebar a:hover, .sidebar a.active { background-color: #4CAF50; color: white; }
        
        /* Content */
        .content { flex: 1; padding: 20px; overflow-y: auto; position: relative; width: 100%; }
        
        /* Mobile Header */
        .mobile-header { display: none; background-color: #2c2c2c; padding: 15px; align-items: center; justify-content: space-between; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .mobile-header h2 { margin: 0; color: #4CAF50; font-size: 1.2rem; }
        .menu-toggle { font-size: 1.5rem; background: none; border: none; color: white; cursor: pointer; }

        /* Card & Grid */
        .card { background-color: #2c2c2c; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; word-wrap: break-word; }
        .card h3 { margin-top: 0; }
        
        /* Responsive Table */
        table { width: 100%; border-collapse: collapse; white-space: nowrap; }
        .table-responsive { display: block; width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
        
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #444; }
        th { background-color: #333; }
        tr:hover { background-color: #383838; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .stat-box { background-color: #2c2c2c; padding: 15px; border-radius: 10px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .stat-value { font-size: 1.5rem; font-weight: bold; color: #4CAF50; }
        .stat-label { color: #aaa; font-size: 0.9rem; }

        /* Responsive Media Queries */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { position: fixed; top: 0; left: 0; transform: translateX(-100%); width: 250px; padding-top: 20px; height: 100%; box-shadow: none; border-right: 1px solid #444; }
            .sidebar.open { transform: translateX(0); box-shadow: 2px 0 10px rgba(0,0,0,0.5); }
            .mobile-header { display: flex; }
            .content { padding: 15px; }
            
            /* Overlay when sidebar open */
            .overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 900; }
            .overlay.active { display: block; }

            /* Adjust stats grid for mobile */
            .stats-grid { grid-template-columns: 1fr 1fr; } 
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    
    <div class="mobile-header">
        <h2>Moovidex Bot</h2>
        <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
    </div>

    <div class="overlay" onclick="toggleSidebar()"></div>

    <div class="sidebar" id="sidebar">
        <h2 class="desktop-only" style="margin-bottom: 20px;">Moovidex Bot</h2>
        <a href="/admin">Dashboard</a>
        <a href="/admin/users">Users</a>
        <a href="/admin/groups">Groups</a>
        <a href="/admin/searches">Search Stats</a>
        <a href="/admin/pm_searches">PM Searches</a>
        <a href="/admin/broadcast">📢 Broadcast</a>
        <a href="/admin/premium">👑 Premium</a>
        <a href="/admin/files">🗃️ Files</a>
        <a href="/admin/settings">⚙️ Settings</a>
        <a href="/admin/pm_user">📩 PM User</a>
        <a href="/admin/logout" style="margin-top: auto; color: #ff6b6b;">Logout</a>
    </div>

    <div class="content">
        {% block content %}{% endblock %}
    </div>

    <script>
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.querySelector('.overlay').classList.toggle('active');
        }
    </script>
</body>
</html>
