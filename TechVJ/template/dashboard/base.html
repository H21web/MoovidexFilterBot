<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moovidex Admin Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: #1a1a1a; color: #f0f0f0; display: flex; height: 100vh; }
        .sidebar { width: 250px; background-color: #2c2c2c; padding: 20px; display: flex; flex-direction: column; }
        .sidebar h2 { margin-top: 0; color: #4CAF50; }
        .sidebar a { color: #ccc; text-decoration: none; padding: 10px; margin: 5px 0; border-radius: 5px; transition: background 0.3s; }
        .sidebar a:hover, .sidebar a.active { background-color: #4CAF50; color: white; }
        .content { flex: 1; padding: 20px; overflow-y: auto; }
        .card { background-color: #2c2c2c; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .card h3 { margin-top: 0; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #444; }
        th { background-color: #333; }
        tr:hover { background-color: #383838; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .stat-box { background-color: #2c2c2c; padding: 20px; border-radius: 10px; text-align: center; }
        .stat-value { font-size: 2em; font-weight: bold; color: #4CAF50; }
        .stat-label { color: #aaa; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="sidebar">
        <h2>Moovidex Bot</h2>
        <a href="/admin">Dashboard</a>
        <a href="/admin/users">Users</a>
        <a href="/admin/groups">Groups</a>
        <a href="/admin/searches">Search Stats</a>
        <a href="/admin/pm_searches">PM Searches</a>
        <a href="/admin/logout" style="margin-top: auto; color: #ff6b6b;">Logout</a>
    </div>
    <div class="content">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
