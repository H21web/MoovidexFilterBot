{% extends "base.html" %}
{% block content %}
<h2>⚙️ Bot Settings</h2>

<div class="card">
    <form action="/admin/settings/update" method="post">
        <table style="width: 100%;">
            <tr>
                <td>Maintenance Mode</td>
                <td style="text-align: right;">
                    <label class="switch">
                        <input type="checkbox" name="maintenance_mode" {% if config.maintenance_mode %}checked{% endif %}>
                        <span class="slider round"></span>
                    </label>
                </td>
            </tr>
            <tr>
                <td>Auto Accept Join Request</td>
                <td style="text-align: right;">
                    <label class="switch">
                        <input type="checkbox" name="auto_accept" {% if config.auto_accept %}checked{% endif %}>
                        <span class="slider round"></span>
                    </label>
                </td>
            </tr>
            <tr>
                <td>Private Filter</td>
                <td style="text-align: right;">
                    <label class="switch">
                        <input type="checkbox" name="private_filter" {% if config.private_filter %}checked{% endif %}>
                        <span class="slider round"></span>
                    </label>
                </td>
            </tr>
            <tr>
                <td>Group Filter</td>
                <td style="text-align: right;">
                    <label class="switch">
                        <input type="checkbox" name="group_filter" {% if config.group_filter %}checked{% endif %}>
                        <span class="slider round"></span>
                    </label>
                </td>
            </tr>
            <tr>
                <td>Force Subscribe</td>
                <td style="text-align: right;">
                    <label class="switch">
                        <input type="checkbox" name="forcesub" {% if config.forcesub %}checked{% endif %}>
                        <span class="slider round"></span>
                    </label>
                </td>
            </tr>
             <tr>
                <td>Spell Check</td>
                <td style="text-align: right;">
                    <label class="switch">
                        <input type="checkbox" name="spoll_check" {% if config.spoll_check %}checked{% endif %}>
                        <span class="slider round"></span>
                    </label>
                </td>
            </tr>
        </table>
        <br>
        <button type="submit" style="padding: 10px 20px; background: #4CAF50; border: none; color: white; border-radius: 5px; cursor: pointer;">Save Settings</button>
    </form>
    
    <style>
    /* The switch - the box around the slider */
    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 24px;
    }

    /* Hide default HTML checkbox */
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    /* The slider */
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #555;
      -webkit-transition: .4s;
      transition: .4s;
      border-radius: 24px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 4px;
      bottom: 4px;
      background-color: white;
      -webkit-transition: .4s;
      transition: .4s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: #2196F3;
    }

    input:focus + .slider {
      box-shadow: 0 0 1px #2196F3;
    }

    input:checked + .slider:before {
      -webkit-transform: translateX(26px);
      -ms-transform: translateX(26px);
      transform: translateX(26px);
    }
    </style>
</div>
{% endblock %}
