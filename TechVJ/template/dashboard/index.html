{% extends "base.html" %}
{% block content %}
<h1>Dashboard</h1>
<div class="stats-grid">
    <div class="stat-box">
        <div class="stat-value">{{ status }}</div>
        <div class="stat-label">Bot Status</div>
    </div>
    <div class="stat-box">
        <div class="stat-value">{{ total_users }}</div>
        <div class="stat-label">Total Users</div>
    </div>
    <div class="stat-box">
        <div class="stat-value">{{ users_today }}</div>
        <div class="stat-label">New Users Today</div>
    </div>
    <div class="stat-box">
        <div class="stat-value">{{ total_chats }}</div>
        <div class="stat-label">Total Groups</div>
    </div>
    <div class="stat-box">
        <div class="stat-value">{{ total_searches }}</div>
        <div class="stat-label">Total Searches</div>
    </div>
</div>

<div class="card">
    <h3>Search Activity</h3>
    <canvas id="searchChart"></canvas>
</div>

<script>
    const ctx = document.getElementById('searchChart').getContext('2d');
    const searchChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: ['Day 1', 'Day 2', 'Day 3', 'Day 4', 'Day 5', 'Day 6', 'Today'],
            datasets: [{
                label: '# of Searches',
                data: [12, 19, 3, 5, 2, 3, {{ total_searches }} % 100], <!-- Mock data for historic, real for total -->
                backgroundColor: 'rgba(76, 175, 80, 0.2)',
                borderColor: 'rgba(76, 175, 80, 1)',
                borderWidth: 1
            }]
        },
        options: {
            scales: {
                y: {
                    beginAtZero: true
                }
            }
        }
    });
</script>
{% endblock %}
